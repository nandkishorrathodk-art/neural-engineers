[project]
name = "neural-company"
version = "0.1.0"
description = "ANCOS: Autonomous Neural Company Operating System — A Self-Managing, Self-Expanding, Multi-Agent Engineering Organization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "redis>=5.1.0",
    "arq>=0.26.0",
    "docker>=7.1.0",
    "litellm>=1.49.0",
    "openai>=1.50.0",
    "anthropic>=0.36.0",
    "google-generativeai>=0.8.0",
    "structlog>=24.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.2",
    "playwright>=1.47.0",
    "websockets>=13.1",
    "pyyaml>=6.0.2",
    "chromadb>=0.5.10",
    "numpy>=1.26.0",
    "Pillow>=10.4.0",
    "networkx>=3.3",
    "rich>=13.8.0"
]

[project.scripts]
ancos = "neural.cli.main:entrypoint"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "types-pyyaml>=6.0.12.20240917",
    "types-redis>=4.6.0.20241004",
    "psutil>=6.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]


[tool.hatch.build.targets.wheel]
packages = ["services/core/neural"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["services/core"]

