services:
  redis:
    image: redis:7-alpine
    container_name: ancos-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ancos-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  docker-broker:
    image: ancos-core-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: ancos-docker-broker
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "neural.containers.broker_api:app", "--host", "0.0.0.0", "--port", "12002"]
    environment:
      - APP_ENV=production
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_BROKER_TOKEN=${DOCKER_BROKER_TOKEN:?Set DOCKER_BROKER_TOKEN in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker:/opt/ancos-docker:ro
    networks:
      - ancos-docker-control
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer $$DOCKER_BROKER_TOKEN' http://127.0.0.1:12002/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  core-api:
    image: ancos-core-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: ancos-core-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:12000:12000"
    environment:
      - APP_ENV=development
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite+aiosqlite:///./data/neural_company.db
      - REDIS_URL=redis://redis:6379/0
      - DOCKER_BROKER_URL=http://docker-broker:12002
      - DOCKER_BROKER_TOKEN=${DOCKER_BROKER_TOKEN:?Set DOCKER_BROKER_TOKEN in .env}
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    depends_on:
      redis:
        condition: service_started
      docker-broker:
        condition: service_healthy
    networks:
      - ancos-network
      - ancos-docker-control
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: ancos-dashboard
    restart: unless-stopped
    ports:
      - "12001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:12000
    depends_on:
      - core-api
    networks:
      - ancos-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  ancos-network:
    name: ancos-network
    driver: bridge
  ancos-docker-control:
    name: ancos-docker-control
    internal: true

volumes:
  redis_data:


