version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ancos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ancos-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: ancos-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - POST=1
      - VOLUMES=1
      - EXEC=0
      - SWARM=0
      - INFO=1
      - VERSION=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ancos-internal-mgmt
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  core-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: ancos-core-api
    restart: unless-stopped
    ports:
      - "12000:12000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite+aiosqlite:///./data/neural_company.db
      - REDIS_URL=redis://redis:6379/0
      - DOCKER_HOST=tcp://docker-proxy:2375
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    depends_on:
      - redis
      - docker-proxy
    networks:
      - ancos-network
      - ancos-internal-mgmt
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: ancos-dashboard
    restart: unless-stopped
    ports:
      - "12001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:12000
    depends_on:
      - core-api
    networks:
      - ancos-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  ancos-network:
    name: ancos-network
    driver: bridge
  ancos-internal-mgmt:
    name: ancos-internal-mgmt
    internal: true

volumes:
  redis_data:


