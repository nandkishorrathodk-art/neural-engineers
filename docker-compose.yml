services:
  data-init:
    image: ancos-core-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: ancos-data-init
    restart: "no"
    # core-api runs as root with cap_drop ALL (no CAP_DAC_OVERRIDE), so it cannot
    # write into a bind-mounted ./data owned by the host user. Grant the container
    # root group access without changing ownership, keeping host-side tooling and
    # tests (which run as the directory owner) working.
    command: ["sh", "-c", "mkdir -p /app/data/workspaces && chgrp -R 0 /app/data && chmod -R g+rwX /app/data"]
    volumes:
      - ./data:/app/data
    networks:
      - ancos-network

  redis:
    image: redis:7-alpine
    container_name: ancos-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ancos-network
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

  docker-broker:
    image: ancos-core-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: ancos-docker-broker
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "neural.containers.broker_api:app", "--host", "0.0.0.0", "--port", "12002"]
    environment:
      - APP_ENV=production
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_BROKER_TOKEN=${DOCKER_BROKER_TOKEN:?Set DOCKER_BROKER_TOKEN in .env}
      - ANCOS_MAX_ACTIVE_DESKTOPS=${ANCOS_MAX_ACTIVE_DESKTOPS:-1}
      - EMPLOYEE_NETWORK=ancos-employee-net
      - VNC_TOKEN_DIR=/run/ancos-vnc-tokens
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker:/opt/ancos-docker:ro
      - vnc_tokens:/run/ancos-vnc-tokens
    networks:
      - ancos-docker-control
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$DOCKER_BROKER_TOKEN\" http://127.0.0.1:12002/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      # On a fresh deployment the broker builds the pinned base employee image
      # during startup warm-up, which can take several minutes. Do not mark the
      # broker unhealthy (and block every dependent service) while that runs.
      start_period: 900s
    depends_on:
      workstation-gateway:
        condition: service_healthy

  workstation-gateway:
    image: ancos-workstation-gateway:local
    build:
      context: .
      dockerfile: docker/Dockerfile.workstation-gateway
    container_name: ancos-workstation-gateway
    restart: unless-stopped
    ports:
      - "${ANCOS_BIND_HOST:-127.0.0.1}:12003:6080"
    volumes:
      - vnc_tokens:/run/ancos-vnc-tokens:ro
    user: "13:13"
    networks:
      - workstation-egress
    read_only: true
    tmpfs:
      - /run:uid=13,gid=13
      - /var/run/squid:uid=13,gid=13
      - /var/log/squid:uid=13,gid=13
      - /var/spool/squid:uid=13,gid=13
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import socket; ports=(3128,6080); sockets=[socket.create_connection(('127.0.0.1',port),2) for port in ports]; [sock.close() for sock in sockets]"
      interval: 10s
      timeout: 3s
      retries: 5

  core-api:
    image: ancos-core-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: ancos-core-api
    restart: unless-stopped
    ports:
      - "${ANCOS_BIND_HOST:-127.0.0.1}:12000:12000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite+aiosqlite:///./data/neural_company.db
      - REDIS_URL=redis://redis:6379/0
      - OWNER_API_TOKEN=${OWNER_API_TOKEN:?Set OWNER_API_TOKEN in .env}
      - APPROVER_API_TOKEN=${APPROVER_API_TOKEN:-}
      - WORKER_API_TOKEN=${WORKER_API_TOKEN:-}
      - WORKER_API_TOKENS=${WORKER_API_TOKENS:-{}}
      - VERIFIER_API_TOKEN=${VERIFIER_API_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_API_BASE=${NVIDIA_API_BASE:-https://integrate.api.nvidia.com/v1}
      - BOSS_LLM_PLANNING_ENABLED=${BOSS_LLM_PLANNING_ENABLED:-true}
      # Comma/JSON list of modes a worker actually consumes. Keep terminal-only
      # until the gui-worker profile is running, otherwise GUI objectives are
      # rejected at plan time.
      - BOSS_SUPPORTED_EXECUTION_MODES=${BOSS_SUPPORTED_EXECUTION_MODES:-["terminal"]}
      - DOCKER_BROKER_URL=http://docker-broker:12002
      - DOCKER_BROKER_TOKEN=${DOCKER_BROKER_TOKEN:?Set DOCKER_BROKER_TOKEN in .env}
      - ANCOS_MAX_ACTIVE_DESKTOPS=${ANCOS_MAX_ACTIVE_DESKTOPS:-1}
      - ANCOS_RESOURCE_POOL_ID=${ANCOS_RESOURCE_POOL_ID:-local}
      - ANCOS_RESOURCE_LEASE_REAPER_SECONDS=${ANCOS_RESOURCE_LEASE_REAPER_SECONDS:-30}
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    depends_on:
      data-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      docker-broker:
        condition: service_healthy
    networks:
      - ancos-network
      - ancos-docker-control
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  terminal-worker:
    profiles: ["workers"]
    image: ancos-core-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: ancos-terminal-worker
    restart: unless-stopped
    command: ["python", "-m", "neural.workers.terminal"]
    environment:
      - ANCOS_CORE_API_URL=http://core-api:12000
      - ANCOS_WORKER_ID=${ANCOS_WORKER_ID:-terminal-worker}
      - ANCOS_WORKER_POLL_SECONDS=${ANCOS_WORKER_POLL_SECONDS:-3}
      - WORKER_API_TOKEN=${WORKER_API_TOKEN:-}
    depends_on:
      core-api:
        condition: service_started
    networks:
      - ancos-network
    read_only: true
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 128
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  gui-worker:
    profiles: ["workers"]
    image: ancos-core-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: ancos-gui-worker
    restart: unless-stopped
    command: ["python", "-m", "neural.workers.gui"]
    environment:
      - ANCOS_CORE_API_URL=http://core-api:12000
      - ANCOS_WORKER_ID=${ANCOS_GUI_WORKER_ID:-gui-worker}
      - ANCOS_WORKER_POLL_SECONDS=${ANCOS_WORKER_POLL_SECONDS:-3}
      - WORKER_API_TOKEN=${WORKER_API_TOKEN:-}
    depends_on:
      core-api:
        condition: service_started
    networks:
      - ancos-network
    read_only: true
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 128
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  terminal-verifier:
    profiles: ["verifiers"]
    image: ancos-core-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: ancos-terminal-verifier
    restart: unless-stopped
    command: ["python", "-m", "neural.workers.verifier"]
    environment:
      - ANCOS_CORE_API_URL=http://core-api:12000
      - ANCOS_VERIFIER_ID=${ANCOS_VERIFIER_ID:-terminal-verifier}
      - ANCOS_VERIFIER_POLL_SECONDS=${ANCOS_VERIFIER_POLL_SECONDS:-5}
      # Profile-only credential: keep base Compose commands usable before the
      # independent verifier is configured. The process fails closed on an empty token.
      - VERIFIER_API_TOKEN=${VERIFIER_API_TOKEN:-}
    depends_on:
      core-api:
        condition: service_started
    networks:
      - ancos-network
    read_only: true
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: ancos-dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - ANCOS_API_URL=http://core-api:12000
      - OWNER_API_TOKEN=${OWNER_API_TOKEN:?Set OWNER_API_TOKEN in .env}
    depends_on:
      - core-api
    networks:
      - ancos-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ingress:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: ancos-ingress
    restart: unless-stopped
    ports:
      - "${ANCOS_BIND_HOST:-127.0.0.1}:12001:12001"
    volumes:
      - ./docker/nginx-ancos.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard
      - workstation-gateway
    networks:
      - ancos-network
      - workstation-egress
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  ancos-network:
    name: ancos-network
    driver: bridge
  ancos-docker-control:
    name: ancos-docker-control
    internal: true
  workstation-egress:
    name: ancos-workstation-egress
    driver: bridge

volumes:
  redis_data:
  vnc_tokens:


